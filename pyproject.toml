[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadrium"
version = "0.2.0"
description = "Scientific software for constructing Supply-Use and Input-Output systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alberto Roca-Florido" }]
keywords = ["input-output", "supply-use", "national-accounts", "economics",
            "SNA", "ESA-2010", "GRAS", "RAS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  # Only the versions CI has actually run green. 3.14 was added to the matrix
  # on 2026-10-10 and goes here after its first pass, not before: a classifier
  # is a promise about what works, and this project does not make those from
  # the fact that something ought to.
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.24", "openpyxl>=3.1"]
# Without these the PyPI page carries no link at all -- not to the repository,
# not to the guide, not to the archived version a citation should point at.
[project.urls]
Repository = "https://github.com/Alberto-Roca-Florido/Quadrium"
Documentation = "https://github.com/Alberto-Roca-Florido/Quadrium/blob/main/docs/GUIDE.md"
Provenance = "https://github.com/Alberto-Roca-Florido/Quadrium/blob/main/PROVENANCE.md"
Archive = "https://doi.org/10.5281/zenodo.22345637"

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
# The engine is numpy-only on purpose and stays that way: `sign_pattern_feasible`
# falls back to its per-line test when scipy is absent, and says so. But the
# VALIDATOR for that function cannot do its job without the exact test, so scipy
# is a checking dependency. It was undeclared until CI ran without it and the
# validator failed, correctly, rather than passing on a test it had not run.
# `xlrd` joins scipy on the same footing and for the same reason: Eurostat
# ships the NUTS 2010-2013 correspondence as a legacy `.xls`, openpyxl cannot
# read one, and `run_mrio_nuts_join.py` needs it to resolve Greece. Without it
# that validator reports the nine Greek regions unresolved instead of guessing.
dev = ["pytest>=7", "scipy>=1.10", "xlrd>=2.0"]

[project.scripts]
quadrium = "quadrium.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
