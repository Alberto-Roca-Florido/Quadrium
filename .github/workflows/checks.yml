# Everything in this repository, on the oldest Python it claims to support and
# the newest ones that exist.
#
# `requires-python = ">=3.10"` is a promise, and a promise nothing tests is a
# guess. 3.10 is the floor; the newest are there to catch a deprecation before a
# user does.
#
# NOTHING IN THE SUITE CAN CHECK THAT THIS LIST IS STILL THE NEWEST.
# The validators are offline by design, and which Python exists is a fact about
# the world on the day you ask. So this drifts, and it did: it said 3.13 while
# 3.14 had been out for a year. It is checked by hand when a release is cut --
# against the runner's own manifest, which is the list of what CI can install:
#     gh api repos/actions/python-versions/contents/versions-manifest.json
# Last checked 2026-10-10: 3.10, 3.13 and 3.14 all build for linux-22.04,
# linux-24.04 and linux-26.04, which is the image `ubuntu-latest` moves to on
# 2026-10-19.
name: checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Mondays. Nothing here changes on its own, but numpy and openpyxl do, and
    # a suite that only runs when someone pushes cannot tell you that your
    # dependencies moved under you.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: python ${{ matrix.python }}${{ matrix.pins && ' (oldest deps)' || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor the package DECLARES, pinned. `numpy>=1.24` is a promise
          # like `requires-python`, and it was being made from a machine
          # running numpy 1.23.5 — below its own stated minimum. A floor nobody
          # installs is a guess.
          - python: "3.10"
            pins: "numpy==1.24.* openpyxl==3.1.*"
          - python: "3.10"
            pins: ""
          # What most users have, and the newest that exists. Both, during a
          # transition: a break under 3.14 that 3.13 does not show is the
          # deprecation this file is here to find, and telling the two apart
          # needs both rows.
          - python: "3.13"
            pins: ""
          - python: "3.14"
            pins: ""
    steps:
      # v7 is node 24. The one breaking change it carries -- a fork's PR is no
      # longer checked out for `pull_request_target` or `workflow_run` -- does
      # not reach this workflow, which triggers on push, pull_request, dispatch
      # and schedule. No inputs are passed, so there is nothing else to break.
      - uses: actions/checkout@v7

      # v7 is node 24 too. It removed the `pip-install` input; this passes
      # `python-version` and `cache`, both of which it still takes.
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Installed, not just importable. `pip install .` is what a user runs,
      # and a package that imports from a checkout but does not install is a
      # package nobody can use -- which is how `--template` came to tell
      # installed users to run a file they do not have.
      # `.[dev]` and not `.` — scipy is a CHECKING dependency, not a runtime one.
      # The engine degrades without it and says so; the validator that tests
      # that degradation cannot.
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          if [ -n "${{ matrix.pins }}" ]; then pip install ${{ matrix.pins }}; fi
          python -c "import numpy, openpyxl; print('numpy', numpy.__version__, '| openpyxl', openpyxl.__version__)"

      - name: the console script exists and answers
        run: quadrium --help

      # The unit tests and every validator, all offline: each one states what it
      # tests, cites the paragraph and page it comes from, and prints the
      # deviation it measured against official data.
      - name: checks
        run: ./check.sh

      # The worked example, end to end, from the installed package rather than
      # from the checkout -- two scenarios, GRAS-balanced, report written.
      # `table_path` in the example resolves against the WORKBOOK, not against
      # the working directory, so it runs from the repository root and not from
      # a temporary folder. That resolution rule is itself worth exercising.
      - name: the shipped example runs
        run: |
          quadrium configs/ejemplo.xlsx --outputs "$RUNNER_TEMP/out"
          ls "$RUNNER_TEMP/out"/*/report.md
